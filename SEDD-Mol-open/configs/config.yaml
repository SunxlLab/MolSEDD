# Default training config: QM9 with a uniform graph (the setting used in the paper).
#
#   python train.py                                  # this file
#   python train.py --config-name config_zinc        # ZINC 250k
#   python train.py --config-name config_moses       # MOSES
#   python train.py --config-name config_qm9_absorb  # QM9, absorbing graph
#
# For SLURM: python train.py -m hydra/launcher=submitit_slurm
defaults:
  - _self_
  - model: medium_un

ngpus: 1

# Token vocabulary size = len(dataset vocab) + 2 (pad + end).
# qm9: 22 | zinc: 64 | moses: 28
tokens: 22

training:
  batch_size: 1024
  accum: 1
  n_iters: 5000
  snapshot_freq: 2500
  log_freq: 50
  eval_freq: 500
  snapshot_freq_for_preemption: 2000
  weight: standard
  snapshot_sampling: False
  ema: 0.9999

data:
  name: qm9                 # qm9 | zinc | moses
  path: data/qm9_train.txt  # one SMILES per line, built by tools/prepare_data.py
  seq_len: 22
  min_len: 6
  max_len: 22
  seed: 33
  num_workers: 4

graph:
  type: uniform
  report_all: False

noise:
  type: loglinear
  sigma_min: 1e-4
  sigma_max: 20

sampling:
  predictor: analytic
  steps: 32
  noise_removal: True

eval:
  batch_size: 32
  perplexity: True
  perplexity_batch_size: 16

optim:
  weight_decay: 0.01
  optimizer: AdamW
  lr: 2e-4
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8
  warmup: 2000
  grad_clip: 1.0

hydra:
  run:
    dir: exp_local/${data.name}/${now:%Y.%m.%d}/${now:%H%M%S}
  sweep:
    dir: exp/${data.name}/${now:%Y.%m.%d}/${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    max_num_timeout: 100000
    partition: g40x
    account: stanford
    mem_gb: 96
    cpus_per_task: 40
    gpus_per_node: ${ngpus}
    constraint: null
