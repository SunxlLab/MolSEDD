# MOSES, uniform graph, 47-token sequences — the checkpoint behind all conditional
# generation / MCTS experiments.
defaults:
  - _self_
  - model: medium_un

ngpus: 1
tokens: 28          # 26 SMILES tokens + pad + end

model:
  length: 47

training:
  batch_size: 512     # 有效批大小 = batch_size / (ngpus * accum) 的 accum 倍
  accum: 2            # 微批 = 512 / (1 * 2) = 256
  n_iters: 80000
  snapshot_freq: 5000
  log_freq: 50
  eval_freq: 500
  snapshot_freq_for_preemption: 5000
  weight: standard
  snapshot_sampling: False
  ema: 0.9999

data:
  name: moses
  path: data/moses_train.txt
  seq_len: 47
  min_len: 24
  max_len: 47
  seed: 33
  num_workers: 4

graph:
  type: uniform
  report_all: False

noise:
  type: loglinear
  sigma_min: 1e-4
  sigma_max: 20

sampling:
  predictor: analytic
  steps: 32
  noise_removal: True

eval:
  batch_size: 32
  perplexity: True
  perplexity_batch_size: 16

optim:
  weight_decay: 0.01
  optimizer: AdamW
  lr: 2e-4
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8
  warmup: 2000
  grad_clip: 1.0

hydra:
  run:
    dir: exp_local/${data.name}/${now:%Y.%m.%d}/${now:%H%M%S}
  sweep:
    dir: exp/${data.name}/${now:%Y.%m.%d}/${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    max_num_timeout: 100000
    partition: g40x
    account: stanford
    mem_gb: 96
    cpus_per_task: 40
    gpus_per_node: ${ngpus}
    constraint: null
