# QM9 + absorbing (mask) graph —— uniform 之外的对照配置。
#
# 注意：论文正文的三个数据集全部使用 uniform 前向过程（graph.type=uniform），
# 本文件只作为对照实验保留，不属于论文报告的主结果。
# absorbing 过程需要比 uniform 更小的学习率（2e-5 vs 2e-4）。
defaults:
  - _self_
  - model: medium

ngpus: 1
tokens: 22

model:
  length: 22

training:
  batch_size: 1024
  accum: 1
  n_iters: 20000
  snapshot_freq: 5000
  log_freq: 50
  eval_freq: 500
  snapshot_freq_for_preemption: 2000
  weight: standard
  snapshot_sampling: False
  ema: 0.9999

data:
  name: qm9
  path: data/qm9_train.txt
  seq_len: 22
  min_len: 6
  max_len: 22
  seed: 33
  num_workers: 4

graph:
  type: absorb
  report_all: False

noise:
  type: loglinear
  sigma_min: 1e-4
  sigma_max: 20

sampling:
  predictor: analytic
  steps: 16
  noise_removal: True

eval:
  batch_size: 32
  perplexity: True
  perplexity_batch_size: 16

optim:
  weight_decay: 0.0
  optimizer: AdamW
  lr: 2e-5
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8
  warmup: 2000
  grad_clip: 1.0

hydra:
  run:
    dir: exp_local/${data.name}/${now:%Y.%m.%d}/${now:%H%M%S}
  sweep:
    dir: exp/${data.name}/${now:%Y.%m.%d}/${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    max_num_timeout: 100000
    partition: g40x
    account: stanford
    mem_gb: 96
    cpus_per_task: 40
    gpus_per_node: ${ngpus}
    constraint: null
