name: sedd
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.9
  - pytorch=2.0.1
  - pytorch-cuda=11.8
  - numpy=1.24
  - pip
  - pip:
      - einops>=0.7
      - omegaconf>=2.3
      - hydra-core>=1.3.2
      - datasets>=2.17
      - pyarrow>=15.0
      - pandas>=2.2
      - rdkit>=2024.3
      - huggingface_hub>=0.21
      # 可选：flash-attn 需要现场编译，装不上会自动回退到 torch SDPA
      # - flash-attn>=2.2.2
