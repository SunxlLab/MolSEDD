# ZINC 250k, uniform graph, 48-token sequences.
defaults:
  - _self_
  - model: medium_un

ngpus: 1
tokens: 64          # 62 SMILES tokens + pad + end

model:
  length: 48      # overrides model/medium_un.yaml (its default is 22)

training:
  batch_size: 256
  accum: 1
  n_iters: 25000
  snapshot_freq: 5000
  log_freq: 50
  eval_freq: 500
  snapshot_freq_for_preemption: 2000
  weight: standard
  snapshot_sampling: False
  ema: 0.9999

data:
  name: zinc
  path: data/zinc_train.txt
  seq_len: 48
  min_len: 29
  max_len: 48
  seed: 33
  num_workers: 4

graph:
  type: uniform
  report_all: False

noise:
  type: loglinear
  sigma_min: 1e-4
  sigma_max: 20

sampling:
  predictor: analytic
  steps: 32
  noise_removal: True

eval:
  batch_size: 32
  perplexity: True
  perplexity_batch_size: 16

optim:
  weight_decay: 0.01
  optimizer: AdamW
  lr: 2e-4
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8
  warmup: 2000
  grad_clip: 1.0

hydra:
  run:
    dir: exp_local/${data.name}/${now:%Y.%m.%d}/${now:%H%M%S}
  sweep:
    dir: exp/${data.name}/${now:%Y.%m.%d}/${now:%H%M%S}
    subdir: ${hydra.job.num}
  launcher:
    max_num_timeout: 100000
    partition: g40x
    account: stanford
    mem_gb: 96
    cpus_per_task: 40
    gpus_per_node: ${ngpus}
    constraint: null
